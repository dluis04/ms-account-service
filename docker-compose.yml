version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: account-db
    environment:
      POSTGRES_DB: account_db
      POSTGRES_USER: account_user
      POSTGRES_PASSWORD: account_pass
    ports:
      - "5433:5432"
    volumes:
      - account_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U account_user -d account_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  ms-account-service:
    build: .
    container_name: ms-account-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/account_db
      QUARKUS_DATASOURCE_USERNAME: account_user
      QUARKUS_DATASOURCE_PASSWORD: account_pass
    ports:
      - "8081:8081"

volumes:
  account_data:

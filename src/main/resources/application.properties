# Application
quarkus.application.name=ms-account-service
quarkus.http.port=8081

# Datasource
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=account_user
quarkus.datasource.password=account_pass
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/account_db
quarkus.datasource.jdbc.max-size=20

# Hibernate ORM
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# JWT Security
quarkus.smallrye-jwt.enabled=true
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://challengebank.com
smallrye.jwt.sign.key.location=privateKey.pem

# CORS
quarkus.http.cors=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=Accept,Authorization,Content-Type,X-Correlation-Id
quarkus.http.cors.exposed-headers=X-Correlation-Id

# Health
quarkus.smallrye-health.root-path=/q/health

# Metrics
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.binder.http-server.enabled=true

# Logging
quarkus.log.console.json=true
quarkus.log.level=INFO
quarkus.log.category."com.challengebank".level=DEBUG
quarkus.log.console.json.additional-field.service.value=ms-account-service

# Jackson
quarkus.jackson.serialization-inclusion=non-null
quarkus.jackson.write-dates-as-timestamps=false

# Customer Service REST Client
quarkus.rest-client.customer-service.url=http://localhost:8080
quarkus.rest-client.customer-service.scope=jakarta.inject.Singleton

# Kafka - Consumer for Transaction Events
kafka.bootstrap.servers=localhost:9092
mp.messaging.incoming.transactions-completed.connector=smallrye-kafka
mp.messaging.incoming.transactions-completed.topic=transactions.completed
mp.messaging.incoming.transactions-completed.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.transactions-completed.group.id=account-service-group
mp.messaging.incoming.transactions-completed.auto.offset.reset=earliest
mp.messaging.incoming.transactions-failed.connector=smallrye-kafka
mp.messaging.incoming.transactions-failed.topic=transactions.failed
mp.messaging.incoming.transactions-failed.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.transactions-failed.group.id=account-service-group
mp.messaging.incoming.transactions-failed.auto.offset.reset=earliest

# Test overrides
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:mem:account_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.flyway.migrate-at-start=false
quarkus.log.console.json=false
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://challengebank.com
mp.messaging.incoming.transactions-completed.connector=smallrye-in-memory
mp.messaging.incoming.transactions-failed.connector=smallrye-in-memory
quarkus.rest-client.customer-service.url=http://localhost:8080
